<rect x="0" y="0" width="960" height="320" fill="#10244c" rx="18"/><g fill="none" stroke="#bdd4fc" stroke-width="4" stroke-linecap="round"><path d="M52 92V80M64 92V70M76 92v-8M88 92V64"/></g><text x="104" y="90" font-size="15" fill="#bdd4fc">paleta de cores</text><text x="48" y="150" font-size="46" fill="#fcfaf6" font-weight="650">Areia · Navy · Ardósia</text><text x="48" y="186" font-size="18" fill="#bdd4fc">A regra de cores dos nossos painéis executivos,</text><text x="48" y="212" font-size="18" fill="#bdd4fc">com tema claro e escuro, validada por cálculo.</text><circle cx="58" cy="248" r="9" fill="#5889e6"/><circle cx="84" cy="248" r="9" fill="#c28412"/><circle cx="110" cy="248" r="9" fill="#c65379"/><circle cx="136" cy="248" r="9" fill="#268bb6"/><circle cx="162" cy="248" r="9" fill="#6f9436"/><circle cx="188" cy="248" r="9" fill="#9977d1"/><circle cx="214" cy="248" r="9" fill="#d25d40"/><circle cx="240" cy="248" r="9" fill="#0c9999"/><text x="48" y="284" font-size="13" fill="#bdd4fc">8 séries em ordem fixa · texto AA · séries ≥ 3:1 · daltonismo ΔE ≥ 11</text><rect x="618" y="48" width="92" height="224" fill="#ece5d9" rx="14"/><text x="630" y="236" font-size="16" fill="#2a261f" font-weight="600">Areia</text><text x="630" y="256" font-size="11" fill="#2a261f">superfícies</text><rect x="720" y="48" width="92" height="224" fill="#10244c" rx="14" stroke="#2c56a8" stroke-width="1.5"/><text x="732" y="236" font-size="16" fill="#f0f5ff" font-weight="600">Navy</text><text x="732" y="256" font-size="11" fill="#f0f5ff">marca</text><rect x="822" y="48" width="92" height="224" fill="#495565" rx="14"/><text x="834" y="236" font-size="16" fill="#f8fafd" font-weight="600">Ardósia</text><text x="834" y="256" font-size="11" fill="#f8fafd">texto</text>
</svg>
